name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag is ancestor of origin/main (tag release)
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "Tag commit is not on main"; exit 1; }

      - name: Verify release tag matches package.json and server.json versions (tag release)
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match expected tag ${EXPECTED_TAG} for version ${PKG_VERSION}"
            exit 1
          fi
          SERVER_VERSION=$(node -p "require('./server.json').version")
          if [ "${SERVER_VERSION}" != "${PKG_VERSION}" ]; then
            echo "server.json version ${SERVER_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          PACKAGE_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          if [ "${PACKAGE_PKG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "server.json packages[0].version ${PACKAGE_PKG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Verify versions and npm registry presence (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "workflow_dispatch must be run from the main branch (current ref: ${GITHUB_REF})"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          if [ "${SERVER_VERSION}" != "${PKG_VERSION}" ]; then
            echo "server.json version ${SERVER_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          PACKAGE_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          if [ "${PACKAGE_PKG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "server.json packages[0].version ${PACKAGE_PKG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          if ! npm view "@qungtai/discord-mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PKG_VERSION} is not published on npm registry yet"
            exit 1
          fi

      # actions/setup-node@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate tools manifest
        run: pnpm tools:manifest

      - name: Generate docs and check README diff
        run: |
          pnpm docs:tools
          git diff --exit-code README.md

      - name: Coverage check
        run: pnpm coverage:check

  npm:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-node@v4.4.0
      # Node 24 bundles npm >= 11.5.1 required for OIDC trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Derive version and publish tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "NPM_TAG_ARG=--tag next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG_ARG=" >> "$GITHUB_ENV"
          fi

      # Package bootstrap procedure before the first workflow run:
      # 1. Ensure the npm user/org owning the scope exists with 2FA enabled.
      # 2. Publish a placeholder version 0.0.0 from a minimal temporary directory
      #    with a package.json (name "@qungtai/discord-mcp", version "0.0.0") and README.md:
      #      npm publish --access public --provenance=false
      # 3. In npmjs.com package Settings > Trusted publishing, add GitHub Actions:
      #      owner: qungtai, repo: discord-mcp, workflow: release.yml, environment: (empty).
      # 4. Mark placeholder deprecated:
      #      npm deprecate @qungtai/discord-mcp@0.0.0 "placeholder"
      # Following the npm release, server.json is submitted to the MCP Registry via the registry job.
      - name: Publish to npm
        run: |
          if npm view "@qungtai/discord-mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already published"
            exit 0
          fi
          npm publish --provenance --access public $NPM_TAG_ARG

  docker:
    needs: [verify, npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Derive version and Docker tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          TAGS="ghcr.io/qungtai/discord-mcp:${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/qungtai/discord-mcp:latest"
          fi
          {
            echo "DOCKER_TAGS<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # docker/setup-qemu-action@v3.7.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      # docker/setup-buildx-action@v3.9.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/login-action@v3.7.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action@v6.9.0
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.DOCKER_TAGS }}

  registry:
    needs: [verify, npm]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.npm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          VERSION="v1.8.7"
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          CHECKSUMS="registry_1.8.7_checksums.txt"
          EXPECTED_SHA256="00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579"
          BASE_URL="https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}"

          curl --fail --location --silent --show-error --remote-name "${BASE_URL}/${ARCHIVE}"
          curl --fail --location --silent --show-error --remote-name "${BASE_URL}/${CHECKSUMS}"

          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum --check --status || {
            echo "Expected literal SHA256 checksum verification failed for ${ARCHIVE}"
            exit 1
          }

          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum --check --status || {
            echo "SHA256 checksum verification failed for ${ARCHIVE}"
            exit 1
          }

          tar -xzf "${ARCHIVE}" mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
