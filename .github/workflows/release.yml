name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match expected tag ${EXPECTED_TAG} for version ${PKG_VERSION}"
            exit 1
          fi

      # actions/setup-node@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate tools manifest
        run: pnpm tools:manifest

      - name: Generate docs and check README diff
        run: |
          pnpm docs:tools
          git diff --exit-code README.md

      - name: Coverage check
        run: pnpm coverage:check

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Derive version and Docker tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          TAGS="ghcr.io/qungtai/discord-mcp:${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/qungtai/discord-mcp:latest"
          fi
          {
            echo "DOCKER_TAGS<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # docker/setup-qemu-action@v3.7.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      # docker/setup-buildx-action@v3.9.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca

      # docker/login-action@v3.7.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action@v6.9.0
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.DOCKER_TAGS }}

  npm:
    needs: [verify, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout@v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-node@v4.4.0
      # Node 24 bundles npm >= 11.5.1 required for OIDC trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Derive version and publish tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "NPM_TAG_ARG=--tag next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG_ARG=" >> "$GITHUB_ENV"
          fi

      # Note: npm trusted publishing must be configured once on npmjs.com for this workflow.
      # The very first version can be published manually.
      # Following the npm release, server.json is submitted to the MCP Registry (e.g. via mcp-publisher publish).
      - name: Publish to npm
        run: npm publish --provenance --access public $NPM_TAG_ARG
